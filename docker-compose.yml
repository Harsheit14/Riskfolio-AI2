version: "3.8"

services:
  # ═══════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═══════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: riskfolio-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: harsh
      POSTGRES_DB: Crypto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riskfolio-network

  # ═══════════════════════════════════════════════════════
  # Redis Cache
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: riskfolio-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riskfolio-network

  # ═══════════════════════════════════════════════════════
  # Riskfolio-AI Backend
  # ═══════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskfolio-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:harsh@postgres:5432/Crypto_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      JWT_EXPIRES_IN: 7d
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - riskfolio-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════
  # Frontend (Optional)
  # ═══════════════════════════════════════════════════════
  frontend:
    image: node:18-alpine
    container_name: riskfolio-frontend
    working_dir: /app
    command: npm run dev
    environment:
      VITE_API_BASE_URL: http://backend:5000/api
    volumes:
      - ../client:/app
    ports:
      - "5173:5173"
    networks:
      - riskfolio-network
    depends_on:
      - backend

# ═══════════════════════════════════════════════════════
# Volumes for persistent data
# ═══════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ═══════════════════════════════════════════════════════
# Network for service communication
# ═══════════════════════════════════════════════════════
networks:
  riskfolio-network:
    driver: bridge
